function ldPopup(u){if(!u.wpn||!u.wpn.length)return'';var h='<div class="ld-popup">';h+='<h4>'+u.name+'</h4>';var bySlot={};u.wpn.forEach(function(w){(bySlot[w.slot]=bySlot[w.slot]||[]).push(w)});Object.keys(bySlot).forEach(function(slot){h+='<div style="margin:6px 0"><span class="ld-wslot" style="display:inline-block;margin-right:8px">'+slot+'</span>';bySlot[slot].forEach(function(w){var cnt=w.count||1;h+='<span class="ld-wname" style="display:inline-block;margin:2px 10px 2px 0">'+(cnt>1?cnt+'\u00d7 ':'')+w.name+'</span>'});h+='</div>'});h+='<div class="ld-mix">Weapons in the build scored above</div>';h+='</div>';return h}

function ldCell(u){var pop=ldPopup(u);return '<td'+(pop?' class="ld-cell" onclick="toggleLd(this)"':'')+'>'+'<span class="raw">'+u.dpp+'</span>'+pop+'</td>'}
function _ldPosPopup(el){var popup=el.querySelector('.ld-popup');if(!popup)return;popup.style.display='block';var rect=el.getBoundingClientRect();var pH=popup.offsetHeight||200;var pW=popup.offsetWidth||420;var vw=window.innerWidth;var vh=window.innerHeight;var left=Math.min(Math.max(10,rect.left),vw-pW-10);if(rect.bottom+pH+10>vh)popup.style.top=Math.max(10,rect.top-pH-4)+'px';else popup.style.top=rect.bottom+4+'px';popup.style.left=left+'px'}
function _ldHidePopup(el){var popup=el.querySelector('.ld-popup');if(popup){popup.style.display='none';popup.style.left='';popup.style.top=''}}
function toggleLd(el){var wasOpen=el.classList.contains('open');document.querySelectorAll('.ld-cell.open').forEach(function(c){c.classList.remove('open');_ldHidePopup(c)});if(!wasOpen){el.classList.add('open');_ldPosPopup(el)}}
document.addEventListener('click',function(e){var cell=e.target.closest('.ld-cell');if(!cell)document.querySelectorAll('.ld-cell.open').forEach(function(c){c.classList.remove('open');_ldHidePopup(c)})});
function renderRow(u,i){var tags=(u.ds?'<span class=\"tag tag-ds\">DS</span>':'')+(u.fly?'<span class=\"tag tag-fly\">FLY</span>':'')+(u.inv?'<span class=\"tag tag-inv\">INV '+u.inv+'</span>':'')+(u.fnp?'<span class=\"tag tag-fnp\">FNP '+u.fnp+'</span>':'')+(u.cfnp?'<span class=\"tag tag-cfnp\">CFNP '+u.cfnp+'+ vs '+u.cfnp_type+'</span>':'')+(u.oc_boost?'<span class=\"tag tag-ocboost\">OC+'+u.oc_boost+'/banner</span>':'')+(u.cost_eff!==null&&u.cost_eff!==undefined?'<span class=\"tag tag-cost\">COST '+u.cost_eff+'</span>':'');return '<tr class="'+(i<3?'top3':'')+'" data-name="'+u.name.toLowerCase()+'"><td class="'+rankClass(i+1)+'">'+(i+1)+'</td><td class="unit-name">'+u.name+'</td><td class="pts">'+u.pts+'</td><td class="score '+scoreClass(u.score)+'">'+u.score+'</td>'+ldCell(u)+'<td class="bar-cell">'+bar(u.dpp_pct,'dpp')+' '+contrib(u.dpp_c)+'</td><td class="raw">'+u.surv_turns+'t</td><td class="bar-cell">'+bar(u.surv_pct,'surv')+' '+contrib(u.surv_c)+'</td><td class="raw">'+u.obj_raw+'</td><td class="bar-cell">'+bar(u.obj_pct,'obj')+' '+contrib(u.obj_c)+'</td><td class="raw">'+u.mob_raw+'</td><td class="bar-cell">'+bar(u.mob_pct,'mob')+' '+contrib(u.mob_c)+'</td><td>'+tags+'</td><td style="font-size:10px;color:#78909c">'+'OC'+u.oc+'</td></tr>'}
function filterMission(mid){var q=document.getElementById('search-'+mid).value.toLowerCase();var rows=document.getElementById('table-'+mid).querySelectorAll('tr[data-name]');var shown=0;rows.forEach(function(r){var m=!q||r.getAttribute('data-name').indexOf(q)!==-1;r.style.display=m?'':'none';if(m)shown++});document.getElementById('count-'+mid).textContent=shown+' / '+rows.length+' units'}
var ACTIVE='';
function isActive(meta){return ACTIVE===''||ACTIVE===meta}
function renderBanner(){var b=document.getElementById('preset-banner'),opts=DATA.meta_info.map(function(p){var sel=isActive(p.slug)?' selected':'';return '<option value="'+p.slug+'"'+sel+'>'+p.label+'</option>'}).join('');var info=DATA.meta_info.filter(function(m){return isActive(m.slug)})[0]||DATA.meta_info[0];var weights=(info&&info.weights?info.weights.map(function(w){return '<span class="preset-weight">'+w[0]+' <b>'+w[1]+'%</b></span>'}).join(''):'');b.innerHTML='<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%"><label for="meta-select">Target mix</label><select id="meta-select" onchange="setMeta(this.value)">'+opts+'</select><div class="preset-weights">'+weights+'</div></div><div class="preset-note">DPP is computed against this opponent army composition. Pack your list against a different meta and the rankings re-rank.</div>'}
function setMeta(slug){ACTIVE=slug;renderBanner();renderMissions();renderTop10();renderInsights()}
function renderMissions(){var c=document.getElementById('missions'),html='';var meta=ACTIVE===''?DATA.meta_info[0].slug:ACTIVE;for(var mission in DATA.meta[meta]){var units=DATA.meta[meta][mission],w=WEIGHTS[mission],f=FACTORS[mission]||{},mid=mission.replace(/[^a-z]/gi,'');var factorHtml='';if(f.playstyle)factorHtml+='<div class="mission-playstyle">'+f.playstyle+'</div>';if(f.factors)factorHtml+='<ul class="factor-list">'+f.factors.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';html+='<div class="mission-card"><div class="mission-header"><div class="mission-name">'+esc(mission)+' <span style="font-size:13px;color:#78909c">('+units.length+' units)</span></div><div class="mission-weights"><span class="weight w-dpp">DPP '+w.dps+'%</span><span class="weight w-surv">SURV '+w.surv+'%</span><span class="weight w-obj">OBJ '+w.obj+'%</span><span class="weight w-mob">MOB '+w.mob+'%</span></div></div>'+(factorHtml?'<details class="mission-factors"><summary>How this disposition scores ▾</summary>'+factorHtml+'</details>':'')+'<div class="search-bar"><input id="search-'+mid+'" type="text" placeholder="Search units..." oninput="filterMission(\''+mid+'\')"><span class="count" id="count-'+mid+'">'+units.length+' / '+units.length+' units</span></div><div class="table-scroll"><table id="table-'+mid+'"><tr><th>#</th><th>Unit</th><th>Pts</th><th>Score</th><th>DPP</th><th class="bar-cell"></th><th>SURV</th><th class="bar-cell"></th><th>OBJ</th><th class="bar-cell"></th><th>MOB</th><th class="bar-cell"></th><th>Tags</th><th>'+profile_header+'</th></tr>';units.forEach(function(u,i){html+=renderRow(u,i)});html+='</table></div></div>'}c.innerHTML=html}
function renderTop10(){var c=document.getElementById('top10'),unitData={};var meta=ACTIVE===''?DATA.meta_info[0].slug:ACTIVE;for(var mission in DATA.meta[meta]){var units=DATA.meta[meta][mission];for(var i=0;i<units.length;i++){var u=units[i];if(!unitData[u.name])unitData[u.name]={name:u.name,pts:u.pts,ds:u.ds,fly:u.fly,inv:u.inv,fnp:u.fnp,cfnp:u.cfnp,cfnp_type:u.cfnp_type,oc_boost:u.oc_boost,t:u.t,w:u.w,oc:u.oc,missions:{}};unitData[u.name].missions[mission]={score:u.score,rank:i+1}}}for(var k in unitData){var u=unitData[k],scores=Object.values(u.missions).map(function(m){return m.score});u.avgScore=Math.round(scores.reduce(function(a,b){return a+b},0)/scores.length*10)/10}var sorted=Object.values(unitData).sort(function(a,b){return b.avgScore-a.avgScore}).slice(0,20);var html='<h2>Top 20 Units (Avg Score)</h2>';sorted.forEach(function(u,idx){var badges=Object.entries(u.missions).sort(function(a,b){return b[1].score-a[1].score}).map(function(kv){var k=kv[0],v=kv[1];return '<span class="mission-badge '+(v.rank===1?'top1':v.rank<=3?'top3':'top5')+'">#'+v.rank+' '+esc(k)+' ('+v.score+')</span>'}).join(' ');var bc=['#ffd700','#c0c0c0','#cd7f32'];html+='<div class="insight-card" style="border-left-color:'+(idx<3?bc[idx]:'#4fc3f7')+'"><div class="insight-title" style="display:flex;justify-content:space-between"><span>#'+(idx+1)+' '+u.name+'</span><span class="pts">'+u.pts+'pts · avg '+u.avgScore+'</span></div><div style="margin:6px 0">'+(u.ds?'<span class="tag tag-ds">DS</span>':'')+(u.fly?'<span class="tag tag-fly">FLY</span>':'')+(u.inv?'<span class="tag tag-inv">INV '+u.inv+'</span>':'')+(u.fnp?'<span class="tag tag-fnp">FNP '+u.fnp+'</span>':'')+(u.cfnp?'<span class="tag tag-cfnp">CFNP '+u.cfnp+'+ vs '+u.cfnp_type+'</span>':'')+(u.oc_boost?'<span class="tag tag-ocboost">OC+'+u.oc_boost+'/banner</span>':'')+'<span style="font-size:11px;color:#78909c;margin-left:8px">'+'OC'+u.oc+'</span></div><div>'+badges+'</div></div>'});c.innerHTML=html}
function renderInsights(){var c=document.getElementById('insights'),html='<h2>Key Insights</h2>';if(EXPERT){html+='<div style="background:#161b22;border:1px solid #30363d;border-left:3px solid #bc8cff;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:11px;color:#8b949e"><b style="color:#bc8cff">Expert assessment</b> — interpretation layer (rules packages are NOT engine numbers). Ratings are band-scale judgement grounded in verified 11e mechanics; DPP/scores below remain generalist and rules-free.</div>';if(EXPERT.play_pattern)html+='<div class="insight-card" style="border-left-color:#bc8cff"><div class="insight-title">How this army plays</div><div class="insight-text">'+mdLite(EXPERT.play_pattern)+'</div></div>';if(EXPERT.army_rule)html+='<div class="insight-card" style="border-left-color:#bc8cff"><div class="insight-title">Army rule</div><div class="insight-text">'+mdLite(EXPERT.army_rule)+'</div></div>';if(EXPERT.disposition_fit&&EXPERT.disposition_fit.length){html+='<div class="insight-card" style="border-left-color:#bc8cff"><div class="insight-title">Disposition fit (expert verdict)</div><table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:6px">';EXPERT.disposition_fit.forEach(function(r){var col=r.fit==="Strong"?"#3fb950":r.fit==="Moderate"?"#58a6ff":r.fit==="Situational"?"#d29922":"#6e7681";html+='<tr><td style="padding:3px 6px;color:#c5cdd9;white-space:nowrap">'+r.mission+'</td><td style="padding:3px 6px;color:'+col+';font-weight:700;white-space:nowrap">'+r.fit+'</td>'+(r.why?'<td style="padding:3px 6px;color:#8b949e">'+mdLite(r.why)+'</td>':'')+'</tr>'});html+='</table></div>'}if(EXPERT.detachments&&EXPERT.detachments.length){var order={Strong:0,Moderate:1,Situational:2,Weak:3,Unrated:4};var dets=EXPERT.detachments.slice().sort(function(a,b){return ((order[a.rating]??9)-(order[b.rating]??9))||(a.dp-b.dp)});html+='<div class="insight-card" style="border-left-color:#bc8cff"><div class="insight-title">Detachments (all, best first — expert rating)</div><div style="max-height:420px;overflow-y:auto">';dets.forEach(function(d){var col=d.rating==="Strong"?"#3fb950":d.rating==="Moderate"?"#58a6ff":d.rating==="Situational"?"#d29922":"#6e7681";html+='<div style="display:flex;gap:8px;padding:3px 0;font-size:11px;flex-wrap:wrap"><span style="color:'+col+';font-weight:700;min-width:86px">'+d.rating+(d.rating_for?' · for '+esc(d.rating_for):'')+'</span><span style="color:#c5cdd9">'+d.name+'</span><span style="color:#78909c">'+d.dp+'DP → '+(d.objectives&&d.objectives.length?d.objectives.join(' + '):d.objective)+'</span></div>'});html+='<div style="margin-top:6px;font-size:10px;color:#6e7681">Roster: MFM v1.5 (11e) — names, DP and objectives are engine data; the rating band is expert judgement, shown with the disposition it was judged for.'+(EXPERT.unrated_count?' '+EXPERT.unrated_count+' of '+EXPERT.detachments.length+' detachments have no expert rating yet — roster entry, not a rule claim.':'')+'</div>'}html+='</div></div>'}var meta=ACTIVE===''?DATA.meta_info[0].slug:ACTIVE;for(var mission in DATA.meta[meta]){var units=DATA.meta[meta][mission];if(units.length>0){var u=units[0];html+='<div class="insight-card"><div class="insight-title">#1 in '+esc(mission)+': '+u.name+'</div><div class="insight-text">'+u.score+' score · '+u.pts+'pts · '+u.dpp+' DPP · '+(u.t!==undefined?'T'+u.t+' W'+u.w+' ':'')+(u.inv?' INV'+u.inv:'')+(u.fnp?' FNP'+u.fnp:'')+(u.cfnp?' CFNP'+u.cfnp+'+'+u.cfnp_type:'')+(u.oc_boost?' OC+'+u.oc_boost+'/banner':'')+(u.ds?' DS':'')+(u.fly?' FLY':'')+' OC'+u.oc+'</div></div>'}}c.innerHTML=html}
renderBanner();renderMissions();renderTop10();renderInsights();
function _ldHideAll(){document.querySelectorAll('.ld-cell').forEach(function(c){if(!c.classList.contains('open'))_ldHidePopup(c)})}
document.addEventListener('mouseover',function(e){var cell=e.target.closest('.ld-cell');if(cell&&!cell.classList.contains('open')){_ldHideAll();_ldPosPopup(cell)}});
document.addEventListener('mouseout',function(e){var cell=e.target.closest('.ld-cell');if(cell&&!cell.classList.contains('open'))_ldHidePopup(cell)});
</script></body></html>
